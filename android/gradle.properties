org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
disable-abi-filtering=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# 关闭 R8 混淆/裁剪：Flutter 3.47 默认给 release 开启 R8，而 shared_preferences_android / path_provider_android
# 通过 jni 用硬编码方法签名查找 Kotlin 方法，混淆 kotlin.coroutines.Continuation 后启动即抛
# NoSuchMethodError（安卓端表现为卡在启动页）。
shrink=false
